name: Build and Push IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Build and Sync Public Assets
        run: npm run build

      - name: Commit Updated Sitemap (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml *.txt public/*.txt || true
          git diff --staged --quiet || git commit -m "chore(seo): update sitemap and indexnow verification files [skip ci]"
          git push || true
