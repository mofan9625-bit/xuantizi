# ==============================================================================
# 选梯指南 (xuantizhinan.vip) - 机场推广链接 301 永久重定向与合规隔离配置文件
# 适用于: Nginx VPS / 宝塔面板 (BT-Panel) / 腾讯云·阿里云 LNMP
# 引入方法: 在主 nginx.conf 的 server { ... } 块内添加:
#          include /var/www/xuantizhinan.vip/nginx-redirects.conf;
# ==============================================================================

# 1. 爬虫防抓取保护头 (防止搜索引擎对 /go/ 与 /go.html 进行索引和传递权重)
location ~ ^/(go|go\.html) {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
}

# 2. 品牌别名 301 永久重定向 (Permanent 301 Redirects)
location = /go/yunjiexian {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    return 301 "https://9625mofan01.yunjiexianaff.com/#/?code=OOYhSj0L";
}

location = /go/dalaoyun {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    return 301 "https://mofanvip01.dalaoyunaff.com/#/?code=QT2rqp5V";
}

